<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - VibeSentry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../static/css/style.css" rel="stylesheet">
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }
        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
            }
        };
    </script>
</head>
<body class="contact-page">
    <nav>
        <div class="container">
            <a href="/" class="logo">VibeSentry</a>
            <div class="nav-links">
                <a href="{{ url_for('pricing') }}">Pricing</a>
                <a href="{{ url_for('contact') }}">Contact</a>
                <a href="{{ url_for('login') }}">Login</a>
                <div class="theme-toggle" onclick="toggleTheme()"></div>
            </div>
        </div>
    </nav>
    
    <div class="main-container">
        <h1>Contact Us</h1>
        <p>Have questions? Reach out to our team for support or inquiries.</p>
        
        <form method="POST" action="/contact" class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="input-field" placeholder="Your Name" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="input-field" placeholder="Your Email" required>
            
            <label for="message">Message</label>
            <textarea id="message" name="message" class="input-field" placeholder="Your Message" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
        
        {% if success %}
            <p class="success mt-4">Message sent successfully!</p>
        {% endif %}
    </div>
    
    <footer>
        <div class="container">
            <p>&copy; 2025 VibeSentry. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
